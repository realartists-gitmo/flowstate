[package]
name = "flowstate-document"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gpui-flowtext = { workspace = true }
gpui.workspace = true
imagesize = { workspace = true }
rustc-hash = { workspace = true }
blake3 = "1.8.5"
loro.workspace = true
postcard.workspace = true
serde.workspace = true
# §A13.1: postcard's Vec<u8> wire format is IDENTICAL to serde_bytes'
# (varint len + raw bytes) — this only swaps the element-wise decode loop
# for a memcpy-scale one. Old packages decode unchanged.
serde_bytes = "0.11"
uuid.workspace = true
flowstate-fidelity.workspace = true
hotpath.workspace = true
loro-internal = "1.13.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# §A13.1.2: native builds use Rayon for multi-MB chunk hashing. Browser
# builds stay single-threaded unless the host opts into a threaded WASM setup.
blake3 = { version = "1.8.5", features = ["rayon"] }
atomicwrites = "0.4.4"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile.workspace = true

[package.metadata.cargo-machete]
# serde_bytes is used via `#[serde(with = "serde_bytes")]` attributes in
# package.rs (§A13.1), which cargo-machete's source scan cannot see.
ignored = ["serde_bytes"]

[features]
hotpath = ["hotpath/hotpath", "gpui-flowtext/hotpath"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu", "gpui-flowtext/hotpath-cpu"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "gpui-flowtext/hotpath-alloc"]
