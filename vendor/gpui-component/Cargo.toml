[workspace]
# Trimmed vendor of https://github.com/longbridge/gpui-component.
#
# Upstream's workspace also builds `story`, `story-web`, `webview` and a dozen
# `examples/*` binaries. We vendor only the three crates flowstate consumes so
# cargo does not have to resolve tree-sitter / lsp / webview dependency trees
# that nothing in this repo links against.
#
# This is an EXCLUDED workspace (see `exclude` in the repo-root Cargo.toml).
# It exists so `crates/ui/Cargo.toml`'s `foo.workspace = true` inheritance has a
# root to resolve against; the crates themselves are consumed as path deps and
# resolve into the flowstate dependency graph, not this one.
members = ["crates/macros", "crates/ui", "crates/assets"]
default-members = ["crates/ui"]
resolver = "2"

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
gpui-component = { path = "crates/ui", version = "0.5.2" }
gpui-component-macros = { path = "crates/macros", version = "0.5.1" }
gpui-component-assets = { path = "crates/assets", version = "0.5.1" }

# PIN: must stay byte-identical to the `rev` used for gpui/gpui_platform in the
# repo-root Cargo.toml. Cargo unifies git dependencies by (url, rev); if these
# two drift apart the build gets TWO distinct gpui crates and every `Window` /
# `App` / `Element` type mismatches across the flowstate <-> gpui-component
# boundary. Bump both together, never one alone.
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
gpui_web = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba" }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba" }

reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba" }
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "c15662463bda39148ba154100dd44d3fba5873a4", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "multipart",
    "rustls-tls-native-roots",
    "socks",
    "stream",
], package = "zed-reqwest", version = "0.12.15-zed" }

anyhow = "1"
log = "0.4"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "7.0.0"
raw-window-handle = "0.6.2"
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_lines_lf",
    "metric_utf16",
] }
rust-i18n = "4.2.0"
schemars = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
smallvec = "1"
smol = "2"
tracing = "0.1.41"
wasm-bindgen = "0.2.113"
errno = { version = "0.3.14", default-features = false }

[workspace.dependencies.windows]
features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices"]
version = "0.58.0"

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
useless_conversion = "allow"
